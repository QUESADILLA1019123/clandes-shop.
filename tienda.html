
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Tienda | CLANDES PREMIUM</title>

  <link rel="stylesheet" href="assets/styles.css?v=16">

  <style>
    /* Identidad personalizada de cada tienda */

    .clandes-header {
      background: #100e0c;
      border-bottom: 1px solid #423725;
    }

    .clandes-header .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .shop-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .shop-logo {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border-radius: 12px;
      border: 1px solid var(--accent, #d4af37);
      background: #201b15;
      color: var(--accent, #d4af37);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.2rem;
      overflow: hidden;
    }

    .shop-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .shop-brand h1 {
      margin: 0;
      font-size: clamp(1rem, 3.7vw, 1.4rem);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    /* Catálogo adaptable */
    #catalog.grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    #catalog .product {
      min-width: 0;
      width: 100%;
    }

    @media (max-width: 700px) {
      #catalog.grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 12px;
      }

      #catalog .product {
        padding: 12px;
      }
    }

    @media (max-width: 340px) {
      #catalog.grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>

<body>

  <header class="clandes-header">
    <div class="wrap">

      <div class="shop-brand">
        <div class="shop-logo" id="shopLogo" aria-label="Logo de la tienda">
          <span id="logoInitial">C</span>
        </div>

        <h1 id="brand">Cargando tienda...</h1>
      </div>

      <a class="button alt" href="index.html">
        Inicio
      </a>

    </div>
  </header>

  <main>

    <section id="hero" class="hero">
      <div class="hero-inner">

        <h2 id="shopTitle">Cargando tienda...</h2>

        <p id="shopDesc">
          Catálogo digital
        </p>

        <span id="shopTag" class="chip">
          CLANDES PREMIUM
        </span>

      </div>
    </section>

    <div id="error" class="notice bad hidden"></div>

    <section class="panel">

      <div class="flex">
        <h2>Catálogo</h2>
        <span id="counter" class="muted"></span>
      </div>

      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Buscar productos"
          aria-label="Buscar productos"
        >
      </div>

      <div id="catalog" class="grid" style="margin-top:16px"></div>

    </section>

    <p class="muted">
      Catálogo informativo. No se realizan cobros ni
      entregas automáticas en esta versión.
    </p>

  </main>

  <script type="module" src="assets/store.js?v=2109"></script>

</body>
</html>
