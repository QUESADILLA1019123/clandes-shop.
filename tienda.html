<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berry Digital | Exclusividad digital</title>
<style>
:root{color-scheme:dark;--gold:#d4af37}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f8f3e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 20px;position:relative;isolation:isolate;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.83)),url('./IMG-20261014-WA0305.jpg') center/cover no-repeat}.hero:before{content:'';position:absolute;inset:0;border:1px solid rgba(212,175,55,.3);pointer-events:none}.tag{border:1px solid rgba(212,175,55,.6);border-radius:100px;padding:9px 17px;background:rgba(0,0,0,.65);font-size:.85rem;color:#f5d889;letter-spacing:.08em}h1{font-size:clamp(2.8rem,10vw,5.7rem);line-height:1.03;margin:24px 0 12px;color:#f2ce72;text-shadow:0 0 25px rgba(212,175,55,.45);letter-spacing:.025em}p{max-width:480px;color:#f1e5c9;font-size:1.08rem}.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:25px}.btn{font:inherit;font-weight:750;border-radius:14px;padding:16px 24px;cursor:pointer;min-width:165px}.primary{background:linear-gradient(135deg,#f7d97c,#d4af37);border:0;color:#17110a}.secondary{background:rgba(0,0,0,.6);border:1px solid #d4af37;color:#f7e1a5}.note{font-size:.85rem;color:#c6b99e;margin-top:25px}.panel{display:none;max-width:400px;width:100%;padding:20px;background:rgba(12,11,9,.94);border:1px solid #a5873f;border-radius:18px;margin-top:18px}.panel.show{display:block}.panel h2{margin-top:0;color:#f2ce72}.panel input{width:100%;padding:13px;margin:6px 0;background:#1e1b16;border:1px solid #6c5933;border-radius:10px;color:#fff;font:inherit}.panel .btn{margin-top:12px;width:100%}.small{font-size:.8rem;color:#d4c6a8}
</style>
</head>
<body><main class="hero"><div class="tag">♛ TIENDA PREMIUM</div><h1>BERRY DIGITAL</h1><p>EXCLUSIVIDAD DIGITAL</p><div class="actions"><button class="btn primary" type="button" onclick="showPanel('registro')">Crear mi cuenta</button><button class="btn secondary" type="button" onclick="showPanel('acceso')">Ya tengo cuenta</button></div><section class="panel" id="registro"><h2>Crear cuenta</h2><p class="small">El registro de clientes estará disponible cuando configuremos autenticación y aprobación del administrador.</p><input placeholder="Nombre" disabled><input placeholder="Número" disabled><input placeholder="Correo" disabled><input placeholder="Contraseña" type="password" disabled><button class="btn primary" disabled>Próximamente</button></section><section class="panel" id="acceso"><h2>Iniciar sesión</h2><p class="small">El acceso se habilitará cuando conectemos Supabase Auth.</p><input placeholder="Correo" disabled><input placeholder="Contraseña" type="password" disabled><button class="btn primary" disabled>Próximamente</button></section><div class="note">Berry Digital · Tienda en preparación</div></main><script>function showPanel(id){for(const el of document.querySelectorAll('.panel'))el.classList.toggle('show',el.id===id)}</script></body>
</html>
